// Wire-compatible subset used by the pinned official TestService peer.
// Field descriptors: https://github.com/grpc/grpc-go/blob/v1.84.0/interop/grpc_testing/messages.pb.go
syntax = "proto3";
package grpc.testing;

enum PayloadType {
  COMPRESSABLE = 0;
}
message Empty {}
message Payload {
  PayloadType type = 1;
  bytes body = 2;
}
message EchoStatus {
  int32 code = 1;
  string message = 2;
}
message SimpleRequest {
  PayloadType response_type = 1;
  int32 response_size = 2;
  Payload payload = 3;
  EchoStatus response_status = 7;
}
message SimpleResponse {
  Payload payload = 1;
}
message StreamingInputCallRequest {
  Payload payload = 1;
}
message StreamingInputCallResponse {
  int32 aggregated_payload_size = 1;
}
message ResponseParameters {
  int32 size = 1;
  int32 interval_us = 2;
}
message StreamingOutputCallRequest {
  PayloadType response_type = 1;
  repeated ResponseParameters response_parameters = 2;
  Payload payload = 3;
  EchoStatus response_status = 7;
}
message StreamingOutputCallResponse {
  Payload payload = 1;
}

service TestService {
  rpc EmptyCall(Empty) returns (Empty);
  rpc UnaryCall(SimpleRequest) returns (SimpleResponse);
  rpc StreamingOutputCall(StreamingOutputCallRequest) returns (stream StreamingOutputCallResponse);
  rpc StreamingInputCall(stream StreamingInputCallRequest) returns (StreamingInputCallResponse);
  rpc FullDuplexCall(stream StreamingOutputCallRequest) returns (stream StreamingOutputCallResponse);
}
