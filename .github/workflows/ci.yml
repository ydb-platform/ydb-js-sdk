name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run attw
      - run: npm run check:surface --workspace=@ydbjs/drizzle-adapter

  fsm-benchmark:
    name: FSM benchmark (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fsm-benchmark-${{ github.event_name }}-${{ github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Measure isolated FSM paths
        shell: bash
        run: npm run bench:fsm -- --outputJson "$RUNNER_TEMP/fsm-benchmark.json" | tee "$RUNNER_TEMP/fsm-benchmark.log"
      - name: Publish scaling summary
        if: always()
        run: node scripts/report-fsm-bench.mjs "$RUNNER_TEMP/fsm-benchmark.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fsm-benchmark-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/fsm-benchmark.json
            ${{ runner.temp }}/fsm-benchmark.log
          if-no-files-found: error
          retention-days: 30

  grpc-runtimes:
    name: gRPC (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: grpc-${{ github.event_name }}-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: node22, runtime: node, version: '22', node: '22' }
          - { id: node24, runtime: node, version: '24', node: '24' }
          - { id: node26, runtime: node, version: '26', node: '26' }
          - { id: bun14, runtime: bun, version: '1.4.3', node: '24' }
    env:
      GRPC_TEST_RUNTIME: ${{ matrix.runtime }}
      GRPC_TEST_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preserve independent Node peer
        run: echo "GRPC_TEST_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          bun-version: '1.4.3'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          cache-dependency-path: packages/grpc/tests/interop-go/go.sum
      - name: Prepare runtime evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/grpc-results"
          : > "$RUNNER_TEMP/grpc-results/workers.jsonl"
          {
            echo "GRPC_TEST_RESULTS=$RUNNER_TEMP/grpc-results/results.json"
            echo "GRPC_TEST_WITNESS=$RUNNER_TEMP/grpc-results/workers.jsonl"
            echo "GRPC_TEST_GO_SERVER=$RUNNER_TEMP/grpc-interop-go"
          } >> "$GITHUB_ENV"
      - name: Build gRPC transport
        run: npm run build --workspace=@ydbjs/grpc
      - name: Build grpc-go interoperability server
        working-directory: packages/grpc/tests/interop-go
        env:
          GOTOOLCHAIN: local
        run: go build -mod=readonly -o "$GRPC_TEST_GO_SERVER" .
      - name: Test gRPC on Node
        if: matrix.runtime == 'node'
        run: node node_modules/vitest/vitest.mjs run --config vitest.grpc.config.ts
      - name: Test gRPC on Bun
        if: matrix.runtime == 'bun'
        run: bun --bun node_modules/vitest/vitest.mjs run --config vitest.grpc.config.ts
      - name: Verify complete suite and actual worker runtime
        if: always()
        run: node scripts/verify-grpc-tests.mjs "$GRPC_TEST_RESULTS" "$GRPC_TEST_WITNESS" "$RUNNER_TEMP/grpc-results/verification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grpc-${{ matrix.id }}
          path: ${{ runner.temp }}/grpc-results/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    concurrency:
      group: ${{ github.event_name }}-${{ github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    services:
      ydb:
        image: ydbplatform/local-ydb:25.2
        ports:
          - 2135:2135
          - 2136:2136
          - 8765:8765
        volumes:
          - /tmp/ydb_certs:/ydb_certs
        env:
          YDB_ENABLE_COLUMN_TABLES: true
          YDB_USE_IN_MEMORY_PDISKS: true
        options: '-h localhost'

    env:
      YDB_STATIC_CREDENTIALS_USER: root
      YDB_STATIC_CREDENTIALS_PASSWORD: 1234
      YDB_STATIC_CREDENTIALS_ENDPOINT: grpc://localhost:2136
      YDB_CONNECTION_STRING: grpc://localhost:2136/local
      YDB_CONNECTION_STRING_SECURE: grpcs://localhost:2135/local
      YDB_SSL_ROOT_CERTIFICATES_FILE: /tmp/ydb_certs/ca.pem

    steps:
      # Checkout the repository
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build gRPC transport
        run: npm run build --workspace=@ydbjs/grpc

      - name: Test
        if: matrix.node-version != 26
        run: npm run test

      - name: Test with coverage
        if: matrix.node-version == 26
        run: npm run coverage -- --reporter=default --reporter=html --reporter=github-actions

      - name: Upload coverage to Codecov
        if: matrix.node-version == 26
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

      - name: Publish coverage report to Object Storage
        if: matrix.node-version == 26
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          bucket=ydb-appteam-sdk-reports
          endpoint=https://storage.yandexcloud.net

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            path="ydb-js-sdk/pr-${{ github.event.pull_request.number }}/"
          else
            path="ydb-js-sdk/"
          fi

          aws --endpoint-url "$endpoint" s3 sync ./coverage "s3://$bucket/${path}coverage/" --delete
          aws --endpoint-url "$endpoint" s3 sync ./html "s3://$bucket/${path}tests/" --delete

          {
            echo "### :bar_chart: [Coverage report](https://$bucket.website.yandexcloud.net/${path}coverage/)"
            echo "### :test_tube: [Test report](https://$bucket.website.yandexcloud.net/${path}tests/)"
          } >> "$GITHUB_STEP_SUMMARY"
