name: Package previews

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Publish commit previews
        run: npm exec -- pkg-pr-new publish --no-compact --no-template --previewVersion './packages/*' './third-parties/*'
